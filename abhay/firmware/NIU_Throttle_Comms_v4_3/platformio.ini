[env:genericSTM32F405RG]
platform = ststm32@19.5.0
board = genericSTM32F405RG
framework = arduino
board_build.mcu = stm32f405rgt6
upload_protocol = stlink
monitor_speed = 115200
; Legacy core USB compilation options retained for compatibility with the
; verified cached core. Core still initializes CDC, but no USB connection is
; needed: application commands/telemetry never call USB begin/read/write.
; Live commands and data use tools/lab.py console over ST-Link RTT.
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x0003
    -D USB_PRODUCT=\"NIU_Hall\"
    -D HAL_PCD_MODULE_ENABLED
    -Wall
    -Wextra
    -Wl,-u,_printf_float
