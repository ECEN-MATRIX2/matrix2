# Genuine standalone ST-LINK/V2, five-wire SWD connection including NRST.
bindto 127.0.0.1
source [find interface/stlink.cfg]
transport select hla_swd
adapter speed 1000
source [find target/stm32f4x.cfg]
reset_config srst_only srst_nogate
# This lab console deliberately exposes no debugger/halt interface.
gdb_port disabled
tcl_port disabled
telnet_port disabled
